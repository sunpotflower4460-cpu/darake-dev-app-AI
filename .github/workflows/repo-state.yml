name: Repo State Snapshot

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  snapshot:
    name: Build repo state snapshot
    runs-on: ubuntu-latest
    steps:
      - name: Build snapshot file
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const repoInfo = await github.rest.repos.get({ owner, repo });
            const pulls = await github.rest.pulls.list({ owner, repo, state: 'all', per_page: 10, sort: 'updated', direction: 'desc' });
            const issues = await github.rest.issues.listForRepo({ owner, repo, state: 'open', per_page: 10 });
            const snapshot = {
              generatedAt: new Date().toISOString(),
              source: 'github-actions',
              repository: {
                name: repoInfo.data.name,
                fullName: repoInfo.data.full_name,
                visibility: repoInfo.data.private ? 'private' : 'public',
                defaultBranch: repoInfo.data.default_branch
              },
              counts: {
                issues: issues.data.filter((item) => !item.pull_request).length,
                pullRequests: pulls.data.length,
                mergedPullRequests: pulls.data.filter((item) => item.merged_at).length
              },
              pullRequests: pulls.data.map((item) => ({
                number: item.number,
                title: item.title,
                status: item.merged_at ? 'merged' : item.state
              }))
            };
            await require('fs').promises.mkdir('snapshot', { recursive: true });
            await require('fs').promises.writeFile('snapshot/repo-state.json', JSON.stringify(snapshot, null, 2));

      - name: Upload snapshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: repo-state
          path: snapshot/repo-state.json
