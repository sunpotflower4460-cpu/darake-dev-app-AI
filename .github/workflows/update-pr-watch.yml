name: Update PR Watch File

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  update:
    name: Update public PR watch file
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build PR watch file
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_WATCH_OUTPUT: public/pr-watch.json
        run: npm run pr:build

      - name: Commit PR watch file if changed
        run: |
          if git diff --quiet -- public/pr-watch.json; then
            echo "No PR watch changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/pr-watch.json
          git commit -m "chore: update PR watch snapshot"
          git push
