name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  build:
    name: Typecheck and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build state file
        run: npm run state:build

      - name: Build review watch file
        run: npm run review:build

      - name: Build PR watch file
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run pr:build

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
