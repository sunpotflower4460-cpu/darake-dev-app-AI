name: Cloudflare Setup

on:
  workflow_dispatch:
    inputs:
      worker_name:
        description: 'Cloudflare Worker name'
        required: true
        default: 'darakedevapp'
      issue_create_enabled:
        description: 'Set GITHUB_ISSUE_CREATE_ENABLED'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: read

jobs:
  apply:
    name: Apply Cloudflare setup
    runs-on: ubuntu-latest
    steps:
      - name: Check required secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Missing GitHub Secret: CLOUDFLARE_API_TOKEN" >&2
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Missing GitHub Secret: CLOUDFLARE_ACCOUNT_ID" >&2
            exit 1
          fi

      - name: Read current Worker settings
        id: read_settings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_NAME: ${{ inputs.worker_name }}
        run: |
          set -euo pipefail
          curl --fail-with-body \
            --request GET \
            --url "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/settings" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header "Content-Type: application/json" \
            --output current-settings.json
          node -e "const fs=require('fs'); const body=JSON.parse(fs.readFileSync('current-settings.json','utf8')); if(!body.success){ console.error(JSON.stringify(body,null,2)); process.exit(1); }"

      - name: Build updated Worker settings
        env:
          ISSUE_CREATE_ENABLED: ${{ inputs.issue_create_enabled }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const response = JSON.parse(fs.readFileSync('current-settings.json', 'utf8'));
          const settings = response.result || {};
          const bindings = Array.isArray(settings.bindings) ? settings.bindings : [];
          const nextBindings = bindings.filter((binding) => binding.name !== 'GITHUB_ISSUE_CREATE_ENABLED');
          nextBindings.push({
            type: 'plain_text',
            name: 'GITHUB_ISSUE_CREATE_ENABLED',
            text: process.env.ISSUE_CREATE_ENABLED || 'true',
          });
          const payload = {
            ...settings,
            bindings: nextBindings,
          };
          fs.writeFileSync('updated-settings.json', JSON.stringify(payload, null, 2));
          NODE

      - name: Apply Worker settings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_NAME: ${{ inputs.worker_name }}
        run: |
          set -euo pipefail
          curl --fail-with-body \
            --request PATCH \
            --url "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/settings" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header "Content-Type: application/json" \
            --data @updated-settings.json

      - name: Done
        run: |
          echo "Cloudflare setup applied."
          echo "GITHUB_ISSUE_CREATE_ENABLED=${{ inputs.issue_create_enabled }}"
          echo "Worker=${{ inputs.worker_name }}"
