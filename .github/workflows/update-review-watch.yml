name: Update Review Watch File

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    name: Update public review watch file
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build review watch file
        env:
          REVIEW_WATCH_OUTPUT: public/review-watch.json
        run: npm run review:build

      - name: Commit review watch file if changed
        run: |
          if git diff --quiet -- public/review-watch.json; then
            echo "No review watch changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/review-watch.json
          git commit -m "chore: update review watch snapshot"
          git push
